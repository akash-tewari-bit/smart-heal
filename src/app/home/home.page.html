<ion-content fullscreen class="home-content">
  <ion-grid>
    <ion-row>
      <ion-col size="12" class="ion-text-right">
        <div class="notification-icon-wrapper position-relative">
          <ion-icon class="notification-icon" name="notifications" color="primary"></ion-icon>
          <ion-badge>2</ion-badge>
        </div>
      </ion-col>
      <ion-col size="12">
        <div class="welcome-banner">
            <h2>Welcome,<br>Dr. Sharma 👋</h2>
            <!-- <p>Here's what's happening today</p> -->
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
  <!-- <div class="welcome-banner">
    <h2>Welcome, Dr. Sharma 👋</h2>
    <p>Here's what's happening today</p>
  </div> -->

  <ion-grid class="stats-grid">
    <ion-row>
      <ion-col size="6">
        <ion-card class="stat-card">
          <ion-card-header>
            <ion-card-title>Appointments</ion-card-title>
          </ion-card-header>
          <ion-card-content>12 Today</ion-card-content>
        </ion-card>
      </ion-col>
      <ion-col size="6">
        <ion-card class="stat-card">
          <ion-card-header>
            <ion-card-title>New Patients</ion-card-title>
          </ion-card-header>
          <ion-card-content>3 New</ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <div class="section-header">
    <h4>Today's Appointments</h4>
    <ion-button fill="clear" size="small">View All</ion-button>
  </div>
  <ion-list>
    <ion-item *ngFor="let patient of appointments">
      <ion-avatar slot="start">
        <img src="assets/avatar-placeholder.png" />
      </ion-avatar>
      <ion-label>
        <h3>{{patient.name}}</h3>
        <p>{{patient.time}} • {{patient.reason}}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>

<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="patients">
      <ion-icon name="people-outline"></ion-icon>
      <ion-label>Patients</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="staff">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Staff</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile">
      <ion-icon name="person-circle-outline"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="more">
      <ion-icon name="menu-outline"></ion-icon>
      <ion-label>More</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
