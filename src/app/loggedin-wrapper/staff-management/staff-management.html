<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <h3>Staff Management</h3>
    </div>
    <div class="col-12 d-flex justify-content-end align-items-center mb-4">
      <button class="btn btn-primary" routerLink="/staff-management/add-staff" [disabled]="staffLeft === 0">
        <i class="bi bi-plus-square me-2"></i>Add Staff
      </button>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <ul class="nav nav-underline border-bottom d-flex justify-content-between" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active text-dark"
            id="home-tab"
            data-bs-toggle="tab"
            data-bs-target="#home-tab-pane"
            type="button"
            role="tab"
            aria-controls="home-tab-pane"
            aria-selected="true"
          >
          Staff List
          </button>
        </li>
        <div class="staff-left d-flex flex-column justify-content-center align-items-center">
          <span class="d-flex gap-2">
              Staff Credits left
            <span class="count d-flex justify-content-center align-items-center gap-1"><i class="bi bi-wallet2"></i>{{this.staffLeft ?? 0}}</span>
          </span>
        </div>
        <!-- <li class="nav-item d-none" role="presentation">
          <button
            class="nav-link text-dark"
            id="profile-tab"
            data-bs-toggle="tab"
            data-bs-target="#profile-tab-pane"
            type="button"
            role="tab"
            aria-controls="profile-tab-pane"
            aria-selected="false"
          >
            Attendance
          </button>
        </li>
        <li class="nav-item d-none" role="presentation">
          <button
            class="nav-link text-dark"
            id="disabled-tab"
            data-bs-toggle="tab"
            data-bs-target="#disabled-tab-pane"
            type="button"
            role="tab"
            aria-controls="disabled-tab-pane"
            aria-selected="false"
          >
            Leave Requests
          </button>
        </li> -->
      </ul>
      <div class="tab-content" id="myTabContent">
        <div
          class="tab-pane fade mt-4 show active"
          id="home-tab-pane"
          role="tabpanel"
          aria-labelledby="home-tab"
          tabindex="0"
        >
          <app-staff-list></app-staff-list>
        </div>
        <div
          class="tab-pane fade mt-4"
          id="profile-tab-pane"
          role="tabpanel"
          aria-labelledby="profile-tab"
          tabindex="0"
        >
          ...
        </div>
        <div
          class="tab-pane fade mt-4"
          id="disabled-tab-pane"
          role="tabpanel"
          aria-labelledby="disabled-tab"
          tabindex="0"
        >
          ...
        </div>
      </div>
    </div>
  </div>
